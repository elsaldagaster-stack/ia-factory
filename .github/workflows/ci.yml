name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Detect doc-only change
        id: paths
        shell: bash
        run: |
          if [[ "${{ github.event_name }}" == "pull_request" ]]; then
            CHANGED=$(git diff --name-only "origin/${{ github.base_ref }}...HEAD")
            echo "Changed files:"
            echo "$CHANGED"
            CODE=$(echo "$CHANGED" | grep -Ev '(\.md$|^docs/|^factory/agents/)' | grep -c . || true)
            [[ ${CODE:-0} -gt 0 ]] && echo "code_changed=true" >> "$GITHUB_OUTPUT" \
                                    || echo "code_changed=false" >> "$GITHUB_OUTPUT"
          else
            echo "code_changed=true" >> "$GITHUB_OUTPUT"
          fi
          grep code_changed "$GITHUB_OUTPUT" || true

      - name: Setup Node.js
        if: steps.paths.outputs.code_changed == 'true'
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        if: steps.paths.outputs.code_changed == 'true'
        run: npm ci

      - name: Type check
        if: steps.paths.outputs.code_changed == 'true'
        run: npm run type-check

      - name: Lint
        if: steps.paths.outputs.code_changed == 'true'
        run: npm run lint

      - name: Tests
        if: steps.paths.outputs.code_changed == 'true'
        run: npm test

      - name: Check PR size
        if: github.event_name == 'pull_request' && steps.paths.outputs.code_changed == 'true'
        run: |
          # Exclude generated files from size check
          DIFF=$(git diff origin/${{ github.base_ref }}...HEAD \
            -- ':!package-lock.json' ':!*.lock' ':!*.snap' ':!*.generated.ts' \
            --shortstat)
          ADDED=$(echo "$DIFF" | grep -oP '\d+(?= insertion)' | head -1 || echo 0)
          DELETED=$(echo "$DIFF" | grep -oP '\d+(?= deletion)' | head -1 || echo 0)
          CHANGED=$((${ADDED:-0} + ${DELETED:-0}))
          echo "Lines changed (excl. generated files): $CHANGED (max: 400)"
          if [ "$CHANGED" -gt 400 ]; then
            echo "::error::PR too large: $CHANGED lines changed. Maximum: 400. Split into smaller PRs."
            exit 1
          fi

      - name: Security audit (production deps only)
        if: steps.paths.outputs.code_changed == 'true'
        # --audit-level=critical: known high vuln in prisma@6.x via deepmerge-ts (<8.0.0)
        # affects @prisma/config stack exhaustion on recursive config merging — CLI only, not runtime
        # tracked: upgrade to prisma@^7.11.0 when Prisma 6→7 migration is scheduled
        run: npm audit --audit-level=critical --omit=dev
