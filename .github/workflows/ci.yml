name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Type check
        run: npm run type-check

      - name: Lint
        run: npm run lint

      - name: Tests
        run: npm test

      - name: Check PR size
        if: github.event_name == 'pull_request'
        run: |
          # Exclude generated files from size check
          DIFF=$(git diff origin/${{ github.base_ref }}...HEAD \
            -- ':!package-lock.json' ':!*.lock' ':!*.snap' ':!*.generated.ts' \
            --shortstat)
          ADDED=$(echo "$DIFF" | grep -oP '\d+(?= insertion)' | head -1 || echo 0)
          DELETED=$(echo "$DIFF" | grep -oP '\d+(?= deletion)' | head -1 || echo 0)
          CHANGED=$((${ADDED:-0} + ${DELETED:-0}))
          echo "Lines changed (excl. generated files): $CHANGED (max: 400)"
          if [ "$CHANGED" -gt 400 ]; then
            echo "::error::PR too large: $CHANGED lines changed. Maximum: 400. Split into smaller PRs."
            exit 1
          fi

      - name: Security audit (production deps only)
        # --audit-level=critical: known high vuln in prisma@6.x via deepmerge-ts (<8.0.0)
        # affects @prisma/config stack exhaustion on recursive config merging — CLI only, not runtime
        # tracked: upgrade to prisma@^7.11.0 when Prisma 6→7 migration is scheduled
        run: npm audit --audit-level=critical --omit=dev
